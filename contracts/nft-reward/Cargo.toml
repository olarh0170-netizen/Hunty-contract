[package]
name = "nft-reward"
version = "0.0.0"
edition = "2021"
publish = false
# The integration test targets under tests/ are declared explicitly below: they
# exercise the full pre-stub API (list_all_nfts, total_supply, operator ops,
# etc.) that is not implemented on main, so they are opt-in until they are
# brought back up to date.
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Re-enables the integration test targets under tests/ that currently do not
# compile against `main`:
#   cargo test -p nft-reward --features stale-integration-tests
stale-integration-tests = []

[[test]]
name = "global_nft_index"
path = "tests/global_nft_index.rs"
required-features = ["stale-integration-tests"]

[[test]]
name = "nft_minted_event_per_hunt"
path = "tests/nft_minted_event_per_hunt.rs"
required-features = ["stale-integration-tests"]

[[test]]
name = "storage_keys"
path = "tests/storage_keys.rs"
required-features = ["stale-integration-tests"]

[dependencies]
soroban-sdk = { workspace = true }
hunty-migration = { path = "../migration", package = "hunty-migration" }
hunty-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

